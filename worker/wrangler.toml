# Brightspark Prep Worker (optional magic-link accounts). The service is
# free and takes no payments; payment code is archived at git tag
# payments-archive-2026-11.
#
# Database IDs are not secrets. Production retains its existing database;
# local and unprovisioned staging use a zero UUID that cannot target it.
# Secrets belong in `wrangler secret put --env ...`, never this file.

name = "brightspark-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# Non-secret config (safe to commit). Secrets go via `wrangler secret put`:
#   EMAIL_API_KEY
[vars]
ENVIRONMENT = "local"
AUTH_EMAIL_LIMIT = "5"
AUTH_IP_LIMIT = "20"
AUTH_DAILY_LIMIT = "1000"
ALLOWED_ORIGIN = "http://localhost:8000"        # CSV of allowed site origins
MAGIC_LINK_BASE = "http://localhost:8000/app.html"  # where /auth/verify link points
EMAIL_FROM = "Brightspark Prep <no-reply@example.com>"
EMAIL_PROVIDER = "console"                       # "console" (dev) | "resend"
CONSENT_VERSION = "2026-05-22"

[[d1_databases]]
binding = "DB"
database_name = "brightspark-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# --- Staging: dedicated resources required before remote use -----------
[env.staging]
workers_dev = true
[env.staging.vars]
ENVIRONMENT = "staging"
AUTH_EMAIL_LIMIT = "5"
AUTH_IP_LIMIT = "20"
AUTH_DAILY_LIMIT = "100"
# Dedicated staging frontend and database; never reuse production bindings.
ALLOWED_ORIGIN = "https://brightspark-staging-site.brightspark.workers.dev"
MAGIC_LINK_BASE = "https://brightspark-staging-site.brightspark.workers.dev/app.html"
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "Brightspark Prep <no-reply@brightsparkprep.com>"
CONSENT_VERSION = "2026-05-22"
[[env.staging.d1_databases]]
binding = "DB"
database_name = "brightspark-staging"
database_id = "f0b341e9-4a16-45da-bf1a-f51fe7387275"
migrations_dir = "migrations"

# --- Production -------------------------------------------------------
# workers_dev on: the public site (github.io) calls this cross-origin, so
# we need a stable *.workers.dev URL until/unless a custom route is added.
[env.production]
workers_dev = true
[env.production.vars]
ENVIRONMENT = "production"
AUTH_EMAIL_LIMIT = "5"
AUTH_IP_LIMIT = "20"
AUTH_DAILY_LIMIT = "1000"
# Custom domain primary; github.io kept as defensive transition fallback
# (remove after custom-domain cutover has bedded in).
ALLOWED_ORIGIN = "https://brightsparkprep.com,https://www.brightsparkprep.com,https://kherhim.github.io"
MAGIC_LINK_BASE = "https://brightsparkprep.com/app.html"
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "Brightspark Prep <no-reply@brightsparkprep.com>"
CONSENT_VERSION = "2026-05-22"
[[env.production.d1_databases]]
binding = "DB"
database_name = "brightspark"
database_id = "3ac83cda-cd45-43b0-b714-42d49954868c"
migrations_dir = "migrations"
